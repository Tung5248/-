function classifyAssistive(a){
  const text=`${a.code||''} ${a.name||''}`;
  if(String(a.code||'').startsWith('FA') || /無障礙|扶手|斜坡|門檻|防滑/.test(text)) return '無障礙改善';
  if(/氣墊|坐墊/.test(text)) return '氣墊床／坐墊';
  if(/照顧床|床墊|床欄|移位機|移位/.test(text)) return '照顧床／床上照顧';
  if(/輪椅|助行|拐杖|步行|四腳/.test(text)) return '輪椅／移動輔具';
  if(/沐浴|洗澡|便盆|馬桶|如廁/.test(text)) return '如廁／沐浴輔具';
  if(/餐|進食|飲食/.test(text)) return '進食／生活輔具';
  return '其他生活輔具';
}

let cls='三類';
const state={care:[],daycare:[],professional:[],respite:[],transport:[]};
const money=n=>'NT$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
const classMap={'一類':'低收','二類':'中低','三類':'一般'};
const copKey={'一類':null,'二類':'copay2','三類':'copay3'};
const el=id=>document.getElementById(id);
function serviceCop(s){if(cls==='一類')return 0;const k=copKey[cls];return s[k]==null?null:s[k]}
function professionalReminder(s){
  if(!s) return '';
  const unit=s.unit||'';
  const cp=serviceCop(s);
  // 專業服務的 price / copay 可能是整個方案（例如 6 次、9,000 元）。
  // 灰字提醒只顯示單次部分負擔與服務次數，不重複顯示身分類別。
  const m=String(unit).match(/(\d+(?:\.\d+)?)\s*次/);
  const count=m?Number(m[1]):1;
  const singleCp=cp==null?null:(count>0?cp/count:cp);
  const amount=singleCp==null?'—':money(singleCp);
  return `<span class="professional-reminder"><span class="reminder-item">單次部分負擔：${amount}</span><span aria-hidden="true">&nbsp;&nbsp;｜&nbsp;&nbsp;</span><span class="reminder-item">服務次數：${unit}</span></span>`;
}
function classLabel(){return `${cls}（${classMap[cls]}）`}
function getItems(t){return state[t]}
function cmsDayOptions(){const lv=Number(el('cms').value);return DATA.daycare.map((s,i)=>({s,i})).filter(x=>x.s.cms===lv||x.s.code==='BD01'||x.s.code==='BD03')}
function optionsFor(t){
 let arr=DATA[t];
 if(t==='daycare') return cmsDayOptions();
 return arr.map((s,i)=>({s,i}));
}
function qtyOptions(t){
 const max=t==='care'?200:(t==='respite'?63:31);
 return Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');

function calcGroup(t){let u=0,c=0;for(const it of state[t]){const s=DATA[t][Number(it.sel.value)],q=Number(it.qty.value)||1;u+=q*s.price;const cp=serviceCop(s);if(cp!=null)c+=q*cp}return {u,c}}

function recalc(){
 const cmsLv=Number(el('cms').value);
 const lim=DATA.cms[String(cmsLv)].care;

 // 三大類共用「照顧及專業服務」月額度。
 const home=calcGroup('care');
 const day=calcGroup('daycare');
 const pro=calcGroup('professional');
 const total=home.u+day.u+pro.u;
 const copay=home.c+day.c+pro.c;
 const remain=lim-total;

 el('homeLimit').textContent=money(lim);
 el('homeUsed').textContent=money(total);
 el('homeRemain').textContent=money(remain);
 el('homeRemain').classList.toggle('over',remain<0);
 el('careCopay').textContent=money(copay);

 // 喘息服務獨立年度額度。
 const rUnits=cmsLv>=7?63:42;
 const rLim=rUnits*770;
 const rz=calcGroup('respite');
 const rr=rLim-rz.u;
 el('respiteLimit').textContent=money(rLim);
 el('respiteUsed').textContent=money(rz.u);
 el('respiteRemain').textContent=money(rr);
 el('respiteRemain').classList.toggle('over',rr<0);
 el('respiteUnits').textContent=`${rUnits} 單位`;

 // 部分負擔類別變更時，同步更新所有已加入服務列的部分負擔金額。
 for(const t of ['care','daycare','professional','respite']){
   for(const it of state[t]){
     const s=DATA[t][Number(it.sel.value)];
     if(!s) continue;
     const q=Number(it.qty.value)||1;
     const cp=serviceCop(s);
     it.price.innerHTML=`<strong>${money(q*s.price)}</strong><small>${cp==null?'部分負擔未列':'部分負擔 '+money(q*cp)}</small>`;
     if(t==='professional'){
       // 重新計算時 price.innerHTML 會把原本的灰字提醒一起刪掉，重新建立並插回金額區。
       const note=document.createElement('div');
       note.className='professional-reminder';
       note.innerHTML=professionalReminder(s);
       it.price.appendChild(note);
     }
   }
 }

 renderAllList();
}

function renderAllList(){
 const box=el('allList'); box.innerHTML='';
 const groups=[['care','居家服務'],['daycare','日照／家庭托顧／社區式服務'],['professional','專業服務'],['respite','喘息服務']];
 let any=false;
 for(const [t,g] of groups){for(const it of state[t]){any=true;const s=DATA[t][Number(it.sel.value)],q=Number(it.qty.value)||1,tot=q*s.price,cp=serviceCop(s);const d=document.createElement('div');d.className='item';d.innerHTML=`<div><b>${g}｜${s.code} ${s.name}</b><small>${q} × ${money(s.price)}／${s.unit}</small>${t==='professional'?professionalReminder(s):''}</div><div><span class="money">${money(tot)}</span><small>${cp==null?'部分負擔未列':'部分負擔 '+money(q*cp)}</small></div>`;box.appendChild(d)}}
 for(const x of state.transport){any=true;const d=document.createElement('div');d.className='item';d.innerHTML=`<div><b>交通接送｜${x.label}</b><small>來回自費</small></div><div><span class="money">${money(x.p)}</span><small>自費</small></div>`;box.appendChild(d)}
 if(!any)box.innerHTML='<div class="hint">目前尚未新增任何服務。</div>';
}

function assistiveRate(){return cls==='一類'?1:(cls==='二類'?0.9:0.7)}
function assistiveCalc(){
  let used=0;
  const seen=new Set();
  for(const it of assistiveState){
    // 第二層防呆：若任何操作造成重複，後加入的那一筆會被清空，不重複計入額度。
    if(it.sel.value !== ''){
      if(seen.has(it.sel.value)){
        it.sel.value='';
        it.result.innerHTML='';
        it.result.classList.add('is-empty');
        continue;
      }
      seen.add(it.sel.value);
    }
    // 尚未搜尋／選擇時，不能把空值 Number('') 當成第 0 筆輔具。
    if(it.sel.value === '') {
      it.result.innerHTML='';
      it.result.classList.add('is-empty');
      continue;
    }
    const a=ASSISTIVE[Number(it.sel.value)]; if(!a)continue;
    // 輔具及無障礙改善的三年額度，依「補助上限」扣抵，不以個案實際部分負擔後的金額計算。
    used+=a.cap;
  }
  const remain=40000-used;
  el('assistiveLimit').textContent=money(40000);
  el('assistiveUsed').textContent=money(used);
  el('assistiveRemain').textContent=money(remain);
  el('assistiveRemain').classList.toggle('over',remain<0);

  for(const it of assistiveState){
    if(it.sel.value === '') continue;
    const a=ASSISTIVE[Number(it.sel.value)]; if(!a)continue;
    // 顯示給個案的補助金額依身分類別：一類100%、二類90%、三類70%。
    const subsidy=Math.floor(a.cap*assistiveRate());
    it.result.innerHTML=`<div class="amount"><strong>${money(subsidy)}</strong><small>預估補助金額</small></div><div class="assistive-meta"><small>最低使用年限 ${a.years?`${a.years} 年`:'無（租賃）'}</small></div>`;
    it.result.classList.remove('is-empty');
  }
}
const assistiveState=[];
function addAssistiveRow(){
  const rows=el('assistiveRows');
  if(!rows)return;
  const row=document.createElement('div'); row.className='assistive-row';
  const searchWrap=document.createElement('div'); searchWrap.className='assistive-search-wrap';
  const search=document.createElement('input'); search.type='search'; search.className='assistive-search';
  search.placeholder='搜尋輔具，例如：照顧床、輪椅、扶手';
  const results=document.createElement('div'); results.className='assistive-search-results';
  searchWrap.append(search,results);

  const sel=document.createElement('select'); sel.className='assistive-select'; sel.style.display='none';
  // 隱藏的 select 仍保留完整索引，讓搜尋選取後能正確帶入該項目的補助上限與使用年限。
  const blank=document.createElement('option');
  blank.value=''; blank.textContent='請選擇輔具'; blank.selected=true;
  sel.appendChild(blank);
  ASSISTIVE.forEach((a,i)=>{
    const option=document.createElement('option');
    option.value=String(i);
    option.textContent=`${a.code}｜${a.name}`;
    sel.appendChild(option);
  });
  const remove=document.createElement('button'); remove.className='danger'; remove.textContent='刪除';
  const result=document.createElement('div'); result.className='assistive-result';
  row.append(searchWrap,sel,remove,result);
  rows.prepend(row);
  const item={row,sel,result,search,results}; assistiveState.push(item);
  // V54：新增後尚未選擇輔具，結果區保持空白。
  result.innerHTML='';
  result.classList.add('is-empty');

  const renderResults=()=>{
    const q=search.value.trim().toLowerCase();
    results.innerHTML='';
    // 已經選過的輔具不再出現在搜尋結果中，避免重複選擇。
    const selectedIndices=new Set(
      assistiveState
        .filter(other=>other!==item && other.sel.value!=='')
        .map(other=>Number(other.sel.value))
    );
    const matches=ASSISTIVE.map((a,i)=>({a,i}))
      .filter(x=>!selectedIndices.has(x.i))
      .filter(x=>!q || `${x.a.code} ${x.a.name}`.toLowerCase().includes(q))
      .sort((x,y)=>String(x.a.code||'').localeCompare(String(y.a.code||''),'en',{numeric:true}));
    if(!matches.length){
      results.innerHTML='<div class="assistive-no-results">找不到符合的項目</div>';
      return;
    }
    matches.forEach(x=>{
      const b=document.createElement('button');
      b.type='button'; b.className='assistive-search-item';
      b.textContent=`${x.a.code}｜${x.a.name}`;
      b.onclick=()=>{
        // 防呆：同一款輔具不能重複加入試算。
        const duplicate=assistiveState.some(other=>other!==item && other.sel.value===String(x.i));
        if(duplicate){
          alert(`「${x.a.code}｜${x.a.name}」已經加入試算囉！\n同一款輔具不能重複選擇。`);
          return;
        }
        sel.value=String(x.i);
        search.value=`${x.a.code}｜${x.a.name}`;
        // 選定後保留搜尋欄與目前選項，讓使用者之後可以再次搜尋並修改。
        // 搜尋結果收起，但搜尋欄不隱藏；再次點擊／輸入即可重新選擇。
        results.innerHTML='';
        assistiveCalc();
        requestAnimationFrame(()=>{
          const addBtn=el('addAssistive');
          if(addBtn) addBtn.scrollIntoView({behavior:'smooth',block:'center'});
        });
      };
      results.appendChild(b);
    });
  };
  search.oninput=renderResults;
  search.onfocus=renderResults;
  // 已選定項目仍可直接修改：點進搜尋欄後重新顯示可選清單，並排除其他列已選項目。
  search.onclick=()=>{renderResults();};
  const refresh=()=>{assistiveCalc();};
  sel.onchange=refresh;
  remove.onclick=()=>{const i=assistiveState.indexOf(item);if(i>=0)assistiveState.splice(i,1);row.remove();assistiveCalc();};
  refresh();
}

function insideCalc(){
  const n=8;
  // 縣內交通來回 8 趟；單趟自付依部分負擔類別：一類0、二類20、三類62。
  const u={ '一類':0, '二類':20, '三類':62 }[cls] ?? 0;
  el('insideTrips').value=n;
  el('insideUnit').value=u;
  const d=el('insideUnitDisplay');
  if(d)d.textContent=money(u);
}

function fillHosp(){
  const town=el('town').value;
  const raw=(DATA.traffic[town]||[]);

  // Excel 的院所資料以「第一筆寫縣市、後續留白」的方式呈現，
  // 因此先把縣市往下繼承，再依指定順序排列：台中 → 雲林 → 南投。
  const cityOrder=['台中','雲林','南投'];
  let currentCity='';
  const normalized=raw.map((x,originalIndex)=>{
    if(x.city) currentCity=x.city;
    return {...x, city:currentCity, originalIndex};
  });

  const hs=[];
  cityOrder.forEach(city=>{
    normalized.filter(x=>x.city===city).forEach(x=>hs.push(x));
  });
  // 若未來資料出現其他縣市，放在指定三縣市之後，避免資料遺失。
  normalized.filter(x=>!cityOrder.includes(x.city)).forEach(x=>hs.push(x));

  const h=el('hospital');
  h.innerHTML='';
  let currentGroup=null;
  hs.forEach((x,i)=>{
    if(x.city!==currentGroup){
      currentGroup=x.city;
      const group=document.createElement('optgroup');
      group.label=x.city||'其他';
      h.appendChild(group);
    }
    const group=h.lastElementChild;
    const opt=document.createElement('option');
    opt.value=String(i);
    opt.textContent=x.hospital;
    group.appendChild(opt);
  });
  h._hs=hs;
  updateTraffic();
}
function updateTraffic(){
  const h=el('hospital')._hs?.[Number(el('hospital').value)],town=el('town').value;
  const c=classMap[cls];
  // 縣外：直接使用醫療院所資料中該身分類別的原始金額，包含一類（低收）。
  const p=h?.prices?.[town]?.[c] ?? null;
  el('outsidePrice').textContent=p==null?'NT$—':money(p);
  el('trafficDesc').textContent=h&&p!=null
    ? `來回自費｜${h.city}｜${h.hospital}`
    :'請選擇醫療院所。';
}

function getTransportEntry(kind){
  if(kind==='inside'){
    const p=(Number(el('insideTrips').value)||0)*(Number(el('insideUnit').value)||0);
    return {kind:'inside',label:'縣內交通',p};
  }
  const h=el('hospital')._hs?.[Number(el('hospital').value)],town=el('town').value,c=classMap[cls];
  const p=h?.prices?.[town]?.[c] ?? 0;
  return {kind:'outside',town,hospitalIndex:Number(el('hospital').value),city:h?.city||'',hospital:h?.hospital||'',label:`縣外｜${town}｜${h?.city||''}｜${h?.hospital||''}`,p};
}
function addTransport(kind){
  const x=getTransportEntry(kind);
  if(x.p<=0)return;
  state.transport.push(x);
  renderTransport();
  recalc();
}
function renderTransport(){
  const b=el('transportList');b.innerHTML='';
  state.transport.forEach((x,i)=>{
    let p=x.p,label=x.label;
    if(x.kind==='inside'){
      // 已加入的縣內交通也要隨部分負擔類別即時更新。
      p=(Number(el('insideTrips').value)||0)*(Number(el('insideUnit').value)||0);
      label='縣內交通';
      x.p=p;
    }else{
      const c=classMap[cls];
      const h=DATA.traffic[x.town]?.[x.hospitalIndex];
      p=h?.prices?.[x.town]?.[c] ?? 0;
      label=`縣外｜${x.town}｜${h?.city||x.city||''}｜${h?.hospital||x.hospital||''}`;
      x.p=p;
    }
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div><b>${label}</b><small>來回自費</small></div><div><span class="money">${money(p)}</span></div><button class="danger">刪除</button>`;
    d.querySelector('button').onclick=()=>{state.transport.splice(i,1);renderTransport();recalc()};
    b.appendChild(d);
  });
}

<script id="v81-navigation-fix">
// V81：快捷導覽改以「服務標題」為定位點，並避開目前實際可見的快捷按鈕列。
(function(){
  const navMap = {
    '照顧／專業':'care',
    '交通':'transport',
    '輔具／無障礙':'assistive',
    '喘息':'respite'
  };

  function getTargetTitle(section){
    return section.querySelector('.section-title') || section;
  }

  function goToSection(id){
    const section = document.getElementById(id);
    if(!section) return;
    const title = getTargetTitle(section);
    const nav = document.querySelector('.nav');
    const header = document.querySelector('.header');

    // 以目前畫面中快捷列的底部為基準，讓標題停在快捷列正下方。
    let offset = 12;
    if(nav){
      const r = nav.getBoundingClientRect();
      if(r.bottom > 0 && r.top < window.innerHeight) offset = r.bottom + 12;
    } else if(header){
      const r = header.getBoundingClientRect();
      if(r.bottom > 0 && r.top < window.innerHeight) offset = r.bottom + 12;
    }

    const y = title.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({top:Math.max(0,y),behavior:'smooth'});

    // 行動裝置瀏覽器可能在平滑捲動後重新計算 sticky 高度，再校正一次。
    window.setTimeout(()=>{
      const nav2 = document.querySelector('.nav');
      const rr = title.getBoundingClientRect();
      let bottom = 0;
      if(nav2){
        const nr = nav2.getBoundingClientRect();
        if(nr.bottom > 0 && nr.top < window.innerHeight) bottom = nr.bottom;
      }
      if(bottom){
        const correction = rr.top - (bottom + 12);
        if(Math.abs(correction) > 4) window.scrollBy({top:correction,behavior:'smooth'});
      }
    }, 500);
  }

  document.addEventListener('click', function(e){
    const a = e.target.closest('.nav a');
    if(!a) return;
    const label = (a.textContent || '').replace(/\s+/g,'').trim();
    for(const key in navMap){
      if(label.includes(key.replace('／','/')) || label.includes(key)){
        e.preventDefault();
        goToSection(navMap[key]);
        history.replaceState(null,'',a.getAttribute('href'));
        return;
      }
    }
  }, true);
})();
</script>

<script id="v88-professional-sort">
(function(){
  const order={CA:1,CB:2,CC:3,CD:4};
  function sortProfessionalSelect(select){
    if(!select || select.tagName!=='SELECT') return;
    const opts=Array.from(select.options);
    const prof=opts.filter(o=>/^(CA|CB|CC|CD)\d+/i.test((o.value||'')+' '+(o.textContent||'')));
    if(prof.length<1) return;
    const rest=opts.filter(o=>!prof.includes(o));
    prof.sort((a,b)=>{
      const am=((a.value||'')+' '+(a.textContent||'')).match(/(CA|CB|CC|CD)(\d+)/i);
      const bm=((b.value||'')+' '+(b.textContent||'')).match(/(CA|CB|CC|CD)(\d+)/i);
      const ag=order[am[1].toUpperCase()]||99, bg=order[bm[1].toUpperCase()]||99;
      return ag-bg || Number(am[2])-Number(bm[2]);
    });
    prof.forEach(o=>select.appendChild(o));
    rest.forEach(o=>select.appendChild(o));
  }
  function run(){document.querySelectorAll('select').forEach(sortProfessionalSelect);}
  document.addEventListener('DOMContentLoaded',run);
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  setTimeout(run,300); setTimeout(run,1000);
})();
</script>
